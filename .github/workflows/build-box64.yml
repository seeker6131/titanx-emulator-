name: TitanX Box64 Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-box64.yml"
      - "app/**"
      - "*.gradle"
      - "settings.gradle"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout TitanX
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build \
            python3 make file binutils

      - name: Fetch Official Box64
        run: |
          git clone --depth 1 \
            https://github.com/ptitSeb/box64.git \
            box64-source

          git -C box64-source rev-parse HEAD \
            > box64-commit.txt

      - name: Configure Box64 Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          cmake -S box64-source -B box64-build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DARM64=ON \
            -DARM_DYNAREC=ON \
            -DBAD_SIGNAL=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Box64
        run: |
          cmake --build box64-build \
            --target box64 \
            --parallel 2

      - name: Verify ARM64 Binary
        shell: bash
        run: |
          set -euo pipefail

          test -s box64-build/box64

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLS="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$TOOLS/llvm-readelf" -h box64-build/box64 \
            | tee box64-elf-report.txt

          grep -q "AArch64" box64-elf-report.txt

          "$TOOLS/llvm-readelf" -d box64-build/box64 \
            > box64-dependencies.txt

      - name: Package Box64 In TitanX APK
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a

          cp box64-build/box64 \
            app/src/main/jniLibs/arm64-v8a/libbox64.so

          test -s \
            app/src/main/jniLibs/arm64-v8a/libbox64.so

      - name: Build TitanX APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -l "$APK" | tee apk-contents.txt

          grep -q "lib/arm64-v8a/libbox64.so" \
            apk-contents.txt

      - name: Upload TitanX APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanX-v2.3-Box64-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Box64 Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TitanX-Box64-Diagnostics
          path: |
            box64-commit.txt
            box64-elf-report.txt
            box64-dependencies.txt
            apk-contents.txt
          if-no-files-found: ignore
