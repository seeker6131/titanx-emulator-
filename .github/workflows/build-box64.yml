
name: TitanX Box64 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-box64.yml"
      - "app/**"
      - "*.gradle"
      - "settings.gradle"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout TitanX
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses > /tmp/sdk-licenses.log 2>&1 || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build make \
            gcc binutils file unzip

      - name: Fetch Official Box64
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/ptitSeb/box64.git \
            box64-source

          git -C box64-source rev-parse HEAD \
            > box64-commit.txt

      - name: Configure Box64
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          cmake \
            -S box64-source \
            -B box64-build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DARM64=ON \
            -DARM_DYNAREC=ON \
            -DBAD_SIGNAL=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Box64
        shell: bash
        run: |
          set -euo pipefail

          cmake --build box64-build \
            --target box64 --parallel 2

          test -s box64-build/box64

      - name: Build Existing CPU Test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-program

          cat > test-program/cpu.S <<'EOF'
          .section .rodata
          message:
              .ascii "TITANX X86_64 TEST\n"
              .ascii "RESULT: 1111111110\n"
              .ascii "CPU TEST PASS\n"
          message_end:

          .section .text
          .global _start
          .type _start, @function

          _start:
              mov $123456789, %rax
              mov $987654321, %rbx
              add %rbx, %rax

              cmp $1111111110, %rax
              jne failed

              mov $1, %rax
              mov $1, %rdi
              lea message(%rip), %rsi
              mov $(message_end-message), %rdx
              syscall

              mov $60, %rax
              xor %rdi, %rdi
              syscall

          failed:
              mov $60, %rax
              mov $1, %rdi
              syscall

          .section .note.GNU-stack,"",@progbits
          EOF

          gcc \
            -nostdlib \
            -fPIE \
            -pie \
            -Wl,--no-dynamic-linker \
            -Wl,-e,_start \
            -o test-program/titanx_x64_test \
            test-program/cpu.S

          chmod +x test-program/titanx_x64_test

          test-program/titanx_x64_test \
            | tee cpu-host-result.txt

          grep -q "CPU TEST PASS" \
            cpu-host-result.txt

      - name: Build Glibc Dynamic Test
        shell: bash
        run: |
          set -euo pipefail

          cat > test-program/glibc_test.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          int main(void) {
              const char *message = "TITANX GLIBC TEST";

              printf("%s\n", message);
              printf("GLIBC STRING LENGTH: %zu\n",
                     strlen(message));

              puts("DYNAMIC LIBRARY TEST PASS");
              fflush(stdout);

              return EXIT_SUCCESS;
          }
          EOF

          gcc \
            -O2 \
            -fPIE \
            -pie \
            -o test-program/titanx_glibc_test \
            test-program/glibc_test.c

          file test-program/titanx_glibc_test \
            | tee glibc-file-report.txt

          readelf -h test-program/titanx_glibc_test \
            | tee glibc-elf-report.txt

          readelf -l test-program/titanx_glibc_test \
            | tee glibc-program-headers.txt

          readelf -d test-program/titanx_glibc_test \
            | tee glibc-dynamic-report.txt

          grep -q "Advanced Micro Devices X86-64" \
            glibc-elf-report.txt

          grep -q "NEEDED" glibc-dynamic-report.txt

          grep -q "libc.so.6" glibc-dynamic-report.txt

          test-program/titanx_glibc_test \
            | tee glibc-host-result.txt

          grep -q "DYNAMIC LIBRARY TEST PASS" \
            glibc-host-result.txt

      - name: Prepare Glibc Runtime Assets
        shell: bash
        run: |
          set -euo pipefail

          DEST="app/src/main/assets/linux_x64"
          mkdir -p "$DEST"

          LOADER="/lib64/ld-linux-x86-64.so.2"
          LIBC="/lib/x86_64-linux-gnu/libc.so.6"

          test -f "$LOADER"
          test -f "$LIBC"

          cp -L "$LOADER" \
            "$DEST/ld-linux-x86-64.so.2"

          cp -L "$LIBC" \
            "$DEST/libc.so.6"

          cp test-program/titanx_glibc_test \
            "$DEST/titanx_glibc_test"

          chmod 755 \
            "$DEST/ld-linux-x86-64.so.2" \
            "$DEST/libc.so.6" \
            "$DEST/titanx_glibc_test"

          file "$DEST/"* \
            | tee glibc-assets-report.txt

          sha256sum "$DEST/"* \
            | tee glibc-assets-sha256.txt

      - name: Package Native Binaries
        shell: bash
        run: |
          set -euo pipefail

          DEST="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"

          cp box64-build/box64 \
            "$DEST/libbox64.so"

          cp test-program/titanx_x64_test \
            "$DEST/libtitanxtest.so"

          chmod 755 \
            "$DEST/libbox64.so" \
            "$DEST/libtitanxtest.so"

          test -s "$DEST/libbox64.so"
          test -s "$DEST/libtitanxtest.so"

          file "$DEST/"* \
            | tee native-binaries-report.txt

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLS="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$TOOLS/llvm-readelf" -h \
            "$DEST/libbox64.so" \
            | tee box64-elf-report.txt

          grep -q "AArch64" box64-elf-report.txt

          readelf -h "$DEST/libtitanxtest.so" \
            | tee cpu-elf-report.txt

          grep -q "Advanced Micro Devices X86-64" \
            cpu-elf-report.txt

      - name: Build TitanX APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Verify APK Contents
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -l "$APK" \
            | tee apk-contents.txt

          for ENTRY in \
            "lib/arm64-v8a/libbox64.so" \
            "lib/arm64-v8a/libtitanxtest.so" \
            "assets/linux_x64/ld-linux-x86-64.so.2" \
            "assets/linux_x64/libc.so.6" \
            "assets/linux_x64/titanx_glibc_test"
          do
            unzip -Z1 "$APK" \
              | grep -Fx "$ENTRY"

            echo "VERIFIED: $ENTRY"
          done

          echo "TITANX v2.6 PACKAGE VERIFICATION PASS"

      - name: Upload TitanX APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanX-v2.6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TitanX-v2.6-Diagnostics
          path: |
            box64-commit.txt
            box64-elf-report.txt
            cpu-host-result.txt
            cpu-elf-report.txt
            glibc-file-report.txt
            glibc-elf-report.txt
            glibc-program-headers.txt
            glibc-dynamic-report.txt
            glibc-host-result.txt
            glibc-assets-report.txt
            glibc-assets-sha256.txt
            native-binaries-report.txt
            apk-contents.txt
          if-no-files-found: ignore
