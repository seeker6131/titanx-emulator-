
name: TitanX Box64 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-box64.yml"
      - "app/**"
      - "*.gradle"
      - "settings.gradle"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout TitanX
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /tmp/licenses.log 2>&1 || true
          tail -n 15 /tmp/licenses.log

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build \
            make file binutils gcc python3

      - name: Fetch Official Box64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ptitSeb/box64.git box64-source
          git -C box64-source rev-parse HEAD > box64-commit.txt

      - name: Configure Box64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          cmake \
            -S box64-source \
            -B box64-build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DARM64=ON \
            -DARM_DYNAREC=ON \
            -DBAD_SIGNAL=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Box64
        shell: bash
        run: |
          set -euo pipefail
          cmake --build box64-build --target box64 --parallel 2
          test -s box64-build/box64

      - name: Create X86-64 CPU Test
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p test-program

          cat > test-program/test.c <<'EOF'
          #include <stdio.h>
          #include <stdint.h>

          int main(void) {
              volatile uint64_t a = 123456789ULL;
              volatile uint64_t b = 987654321ULL;
              uint64_t result = a + b;

              puts("TITANX X86_64 TEST");
              printf("RESULT: %llu\n",
                     (unsigned long long)result);

              if (result == 1111111110ULL) {
                  puts("CPU TEST PASS");
                  return 0;
              }

              puts("CPU TEST FAILED");
              return 1;
          }
          EOF

          gcc -static -O2 -no-pie \
            -o test-program/titanx_x64_test \
            test-program/test.c

          file test-program/titanx_x64_test

          readelf -h test-program/titanx_x64_test \
            | tee x64-test-elf-report.txt

          grep -q "Advanced Micro Devices X86-64" \
            x64-test-elf-report.txt

          readelf -l test-program/titanx_x64_test \
            | tee x64-test-program-headers.txt

      - name: Package Native Binaries
        shell: bash
        run: |
          set -euo pipefail

          DEST="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"

          cp box64-build/box64 "$DEST/libbox64.so"

          cp test-program/titanx_x64_test \
            "$DEST/libtitanxtest.so"

          chmod 755 "$DEST/libbox64.so"
          chmod 755 "$DEST/libtitanxtest.so"

          test -s "$DEST/libbox64.so"
          test -s "$DEST/libtitanxtest.so"

          file "$DEST/libbox64.so"
          file "$DEST/libtitanxtest.so"

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLS="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$TOOLS/llvm-readelf" -h \
            "$DEST/libbox64.so" \
            | tee box64-elf-report.txt

          grep -q AArch64 box64-elf-report.txt

          readelf -h "$DEST/libtitanxtest.so" \
            | grep -q "Advanced Micro Devices X86-64"

      - name: Build TitanX APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Verify APK Contents
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          unzip -l "$APK" | tee apk-contents.txt

          grep -q "lib/arm64-v8a/libbox64.so" \
            apk-contents.txt

          grep -q "lib/arm64-v8a/libtitanxtest.so" \
            apk-contents.txt

          mkdir -p apk-check

          unzip -p "$APK" \
            lib/arm64-v8a/libtitanxtest.so \
            > apk-check/libtitanxtest.so

          readelf -h apk-check/libtitanxtest.so \
            | tee packaged-test-elf.txt

          grep -q "Advanced Micro Devices X86-64" \
            packaged-test-elf.txt

          echo "X86-64 test binary preserved in APK."

      - name: Upload TitanX APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanX-v2.5.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TitanX-v2.5.2-Diagnostics
          path: |
            box64-commit.txt
            box64-elf-report.txt
            x64-test-elf-report.txt
            x64-test-program-headers.txt
            packaged-test-elf.txt
            apk-contents.txt
          if-no-files-found: ignore
