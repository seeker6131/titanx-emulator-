name: TitanX GTA Checker - Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TitanX-GTA-Checker-v0.1-Source.zip'
      - '.github/workflows/titanx-gta-checker-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          test -s TitanX-GTA-Checker-v0.1-Source.zip
          unzip -q TitanX-GTA-Checker-v0.1-Source.zip -d checker-src
          test -s checker-src/titanx-gta-checker/app/src/main/java/com/titanx/gtachecker/MainActivity.java

      - name: Build Android APK
        run: gradle -p checker-src/titanx-gta-checker :app:assembleDebug --no-daemon --stacktrace

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          APK=checker-src/titanx-gta-checker/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/TitanX-GTA-Checker-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanX-GTA-Checker-v0.1-APK
          path: output/
          if-no-files-found: error
