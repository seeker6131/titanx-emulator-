name: TitanX 8GB - Wine Game Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout TitanX and driver bundle
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;24.0.8215888' 'cmake;3.22.1'

      - name: Fetch verified Winlator 11.2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir winlator
          git -C winlator init -q
          git -C winlator remote add origin https://github.com/brunodev85/winlator-app.git
          git -C winlator fetch --depth 1 origin 8077f374ef2d54127b088de9e8cd7b4af14d9c8b
          git -C winlator checkout --detach FETCH_HEAD
          test "$(git -C winlator rev-parse HEAD)" = 8077f374ef2d54127b088de9e8cd7b4af14d9c8b
          test -s winlator/app/src/main/assets/rootfs.tzst

      - name: Verify real driver binaries and load TitanX modifications
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          src=Path('TitanX-8G2-Driver-Bundle-v1.zip')
          if not src.is_file():
              raise SystemExit('Upload TitanX-8G2-Driver-Bundle-v1.zip into the repository root first')
          expected={
              'assets/graphics_driver/turnip-27.0.0-r3-8G2.tzst',
              'assets/dxwrapper/dxvk-2.4.1-user.tzst',
              'assets/dxwrapper/dxvk-2.6.9-gplall-test.tzst'
          }
          with zipfile.ZipFile(src) as z:
              info=json.loads(z.read('manifest.json'))
              if set(info['files'])!=expected: raise RuntimeError('Wrong driver archive inventory')
              for name in sorted(expected):
                  binary=z.read(name)
                  if hashlib.sha256(binary).hexdigest()!=info['files'][name]:
                      raise RuntimeError('SHA256 mismatch: '+name)
                  output=Path('winlator/app/src/main')/name
                  output.parent.mkdir(parents=True,exist_ok=True)
                  output.write_bytes(binary)
                  print('OK:',name,len(binary),'bytes')
              patch=z.read('titanx_patch.py')
              if hashlib.sha256(patch).hexdigest()!=info['patch_sha256']:
                  raise RuntimeError('TitanX code integrity check failed')
              Path('titanx_patch.py').write_bytes(patch)
              Path('winlator/TITANX_DRIVER_CREDITS.txt').write_bytes(z.read('DRIVER-CREDITS-AND-NOTES.txt'))
          PY

      - name: Apply real Turnip and DXVK dropdowns plus 8GB tuning
        run: python3 titanx_patch.py

      - name: Fix native driver paths and startup diagnostics (v4.2)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('winlator')

          def change(path, old, new):
              f = root/path
              txt = f.read_text(encoding='utf-8')
              n = txt.count(old)
              if n != 1:
                  raise RuntimeError(f'Unexpected upstream source in {path}: match count {n}')
              f.write_text(txt.replace(old, new, 1), encoding='utf-8')
              print('Fixed:', path)

          # Fix the Android package rebrand: native C servers and Java storage
          # still reference /data/data/com.winlator in the v4.1 build.
          paths = (
              'app/src/main/cpp/vortekrenderer/include/vortek.h',
              'app/src/main/cpp/gladiorenderer/include/gladio.h',
              'app/src/main/java/com/winlator/core/AppUtils.java',
          )
          for path in paths:
              change(path, '/data/data/com.winlator/', '/data/data/com.titanx.engine8gb/')

          change('app/build.gradle', 'versionCode 410', 'versionCode 420')
          change('app/build.gradle', 'versionName "4.1.0-beta"', 'versionName "4.2.0-beta"')

          # Detect failures instead of displaying an indefinite Starting up dialog.
          path = 'app/src/main/java/com/winlator/XServerDisplayActivity.java'
          change(path, '    private String screenEffectProfile;', '''    private String screenEffectProfile;
              private volatile boolean titanxDesktopVisible = false;
              private volatile String titanxBootStage = "initializing";
              private final java.util.concurrent.atomic.AtomicBoolean titanxErrorShown =
                      new java.util.concurrent.atomic.AtomicBoolean(false);

              private void reportTitanxStartFailure(String reason) {
                  if (titanxDesktopVisible || !titanxErrorShown.compareAndSet(false, true)) return;
                  runOnUiThread(() -> {
                      if (isFinishing() || isDestroyed()) return;
                      new androidx.appcompat.app.AlertDialog.Builder(this)
                              .setTitle("TitanX 4.2 - Startup Diagnostic")
                              .setMessage(reason + "\\nStage: " + titanxBootStage
                                      + "\\n\\nPlease send a screenshot of this message.")
                              .setPositiveButton("OK", null).show();
                  });
              }
          ''')
          change(path, '                    flags[0] = true;', '''                    flags[0] = true;
                              titanxDesktopVisible = true;''')
          change(path, '        setupUI();\n\n        Executors.newSingleThreadExecutor().execute(() -> {\n            if (!isGenerateWineprefix()) {\n                setupWineSystemFiles();\n                extractGraphicsDriverFiles();\n                changeWineAudioDriver();\n            }\n            setupXEnvironment();\n        });', '''        setupUI();

                  if (!isGenerateWineprefix()) {
                      new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> {
                          if (!titanxDesktopVisible && !isFinishing()) {
                              File r = rootFS.getRootDir();
                              File binary = new File(r, "usr/local/bin/box64");
                              File wine = new File(r, "opt/wine/bin/wine");
                              reportTitanxStartFailure("No Windows desktop after 90 seconds."
                                  + "\\nBox64 exists: " + binary.isFile()
                                  + "\\nWine exists: " + wine.isFile()
                                  + "\\nRootFS exists: " + r.isDirectory());
                          }
                      }, 90000L);
                  }

                  Executors.newSingleThreadExecutor().execute(() -> {
                      try {
                          if (!isGenerateWineprefix()) {
                              titanxBootStage = "Preparing Wine files";
                              setupWineSystemFiles();
                              titanxBootStage = "Loading graphics driver";
                              extractGraphicsDriverFiles();
                              titanxBootStage = "Starting audio";
                              changeWineAudioDriver();
                          }
                          titanxBootStage = "Launching Box64 and X11";
                          setupXEnvironment();
                          titanxBootStage = "Waiting for Wine desktop";
                      } catch (Throwable e) {
                          android.util.Log.e("TitanXBoot", "Startup exception: " + titanxBootStage, e);
                          reportTitanxStartFailure("Startup exception: " + e.toString());
                      }
                  });''')
          change(path, '        GuestProgramLauncherComponent guestProgramLauncherComponent = new GuestProgramLauncherComponent();', '''        GuestProgramLauncherComponent guestProgramLauncherComponent = new GuestProgramLauncherComponent();
                  guestProgramLauncherComponent.setTerminationCallback(code -> {
                      if (!titanxDesktopVisible && !isGenerateWineprefix()) {
                          reportTitanxStartFailure("Wine/Box64 process exited before desktop. Exit code: " + code);
                      }
                  });''')

          # Build-time source proof: no old package storage/socket paths in Java and native headers.
          for part in ('app/src/main/cpp', 'app/src/main/java'):
              for f in (root/part).rglob('*'):
                  if f.suffix not in ('.java', '.h', '.c', '.cpp'): continue
                  data = f.read_text(encoding='utf-8', errors='replace')
                  if '/data/data/com.winlator/' in data:
                      raise RuntimeError(f'Unfixed package path: {f}')
          print('TitanX v4.2 source patch complete. No /data/data/com.winlator/ path remains in source.')
          PY

      - name: Keep stable debug signing key
        uses: actions/cache@v4
        with:
          path: .titanx-signing/debug.keystore
          key: titanx-engine8gb-debug-key-v1

      - name: Compile TitanX APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .titanx-signing "$HOME/.android"
          if test -s .titanx-signing/debug.keystore; then
            cp .titanx-signing/debug.keystore "$HOME/.android/debug.keystore"
          fi
          cd winlator
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          cd ..
          if test -s "$HOME/.android/debug.keystore"; then
            cp "$HOME/.android/debug.keystore" .titanx-signing/debug.keystore
          fi

      - name: Verify packaged APK and licenses
        shell: bash
        run: |
          set -euo pipefail
          APK=winlator/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > apk-manifest.txt
          for file in \
            assets/rootfs.tzst \
            assets/graphics_driver/turnip-27.0.0-r3-8G2.tzst \
            assets/dxwrapper/dxvk-2.4.1-user.tzst \
            assets/dxwrapper/dxvk-2.6.9-gplall-test.tzst; do
              grep -Fx "$file" apk-manifest.txt
          done
          mkdir -p output
          cp "$APK" output/TitanX-S23Ultra-8GB-v4.2.apk
          cp winlator/LICENSE output/WINLATOR-LICENSE.txt
          cp winlator/TITANX_DRIVER_CREDITS.txt output/DRIVER-CREDITS.txt
          sha256sum output/*.apk > output/APK-SHA256.txt

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanX-8G2-v4.2-FixedStartup-APK
          path: output/
          if-no-files-found: error

      - name: Publish corresponding source for license compliance
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tar -C winlator --exclude=.git --exclude=.gradle --exclude='app/build' \
            -czf TitanX-8G2-Modified-Source.tar.gz .

      - name: Upload modified source and notices
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TitanX-8G2-Modified-Source
          path: TitanX-8G2-Modified-Source.tar.gz
          if-no-files-found: error
