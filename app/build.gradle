
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.titanx.emulator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.titanx.emulator'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
