
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.titanx.emulator'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.titanx.emulator'
        minSdk 29
        targetSdk 35

        versionCode 252
        versionName '2.5.2'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += [
                '**/libbox64.so',
                '**/libtitanxtest.so'
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
